# Keep the default Ctrl-b prefix and add Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g mouse on
set -g history-limit 10000

# Catppuccin Mocha, without external plugins.
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g message-style 'bg=#585b70,fg=#cdd6f4'
set -g pane-border-style 'fg=#585b70'
set -g pane-active-border-style 'fg=#89b4fa'
setw -g window-status-current-style 'bg=#585b70,fg=#cdd6f4'
